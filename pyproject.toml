[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qoolqit"
description = "A Python library for developing algorithms in the Rydberg Analog Model."
readme = "README.md"
version = "1.7.0"
requires-python = ">=3.11"
license = { text = "MIT-derived" }
keywords = ["quantum"]
authors = [
  { name = "Alessandro Santini", email = "alessandro.santini@pasqal.com" },
  { name = "Antoine Bussy", email = "antoine.bussy@pasqal.com" },
  { name = "Charles Moussa"},
  { name = "Clément de Terrasson de Montleau", email = "clement.de-terrasson@pasqal.com" },
  { name = "David Teller"},
  { name = "João Moutinho"},
  { name = "Manu Lahariya"},
  { name = "Mathieu Garrigues", email = "mathieu.garrigues@pasqal.com" },
  { name = "Roland Guichard"},
  { name = "Stefano Grava", email = "stefano.grava@pasqal.com" },
  { name = "Vittorio Vitale", email = "vittorio.vitale@pasqal.com" },
  { name = "Vytautas Abramavicius"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]

dependencies = [
  "networkx>=3.5",
  "numpy>=2",
  "pulser[torch]>=1.9.0",
  "typing-extensions>=4.10",
]

[project.optional-dependencies]
extras = [
  "emu_sv",
  "emu_mps",
  "torch_geometric",
  "pandas",
  "seaborn",
]

# Install together with the local project, e.g. `pip install -e . --group dev`:
# without `-e .`, the `qoolqit[extras]` entries would install qoolqit from PyPI.
[dependency-groups]
test = [
  "qoolqit[extras]",
  "pytest",
  "pytest-cov",
  "pytest-markdown-docs",
]
docs = [
  "qoolqit[extras]",
  "ipykernel",
  "nbclient",
  "nbconvert",
  "zensical>=0.1.0",
  "mkdocstrings-python",
  "griffe-inherited-docstrings",
  "markdown-exec>=1.12.6",
  # Formats API signatures (separate_signature). Keep in sync with the ruff-pre-commit rev.
  "ruff==0.17.6",
  # Temporary: Zensical-compatible mike fork until Zensical ships native versioning.
  # See https://zensical.org/docs/compatibility/mkdocs/mike/
  "mike @ git+https://github.com/squidfunk/mike.git@0f62791256ebeba60d20d2f1d8fe6ec3b7d1e2b3", # 2.2.0+zensical-0.1.0
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "mypy==2.4.1",
  "pre-commit",
]
# PyTorch build, uv only (see [tool.uv.sources]): `uv sync` installs the default PyPI wheels,
# with CUDA on Linux; `--group cpu` installs the CPU-only wheels, which CI uses (no GPU).
cpu = [
  "torch",
]
# Same as plain `uv sync`; declared so uv can mark it as conflicting with `cpu`.
cuda = [
  "torch",
]

[project.urls]
Documentation = "https://pasqal-io.github.io/qoolqit/latest"
Issues = "https://github.com/pasqal-io/qoolqit/issues"
Source = "https://github.com/pasqal-io/qoolqit"

[tool.hatch.build.targets.sdist]
only-include = ["qoolqit"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

# CPU-only PyTorch for the `cpu` group: on Linux, the PyPI wheels pull in the CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vvv --cov-report=term-missing --cov-config=pyproject.toml --cov=qoolqit --markdown-docs"
xfail_strict = true

[tool.coverage.run]
branch = true
parallel = true
omit = ["*__init__.py"]

[tool.coverage.report]
fail_under = 94
exclude_also = [
  "def __str__",
  "def __repr__",
  "def draw",
  "@abstractmethod",
  "@overload",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "Q", # flake8-quotes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "D", # pydocstyle
    "PGH", # pygrep-hooks
]
isort.required-imports = ["from __future__ import annotations"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"*.ipynb" = ["E402", "I002"]
"tests/**" = ["D"]

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code"]
exclude_gitignore = true
