name: Docs

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
            - closed

concurrency: gh-pages-${{ github.repository }}

env:
    # Previews exist while the PR has the `docs-preview` label: removing it or closing the PR removes them
    REMOVE_PREVIEW: ${{ github.event.action == 'closed' || github.event.action == 'unlabeled' }}

jobs:
    build-docs:
        name: Build docs
        # No need to build docs when PR is closed, a label is removed, or a label other than `docs-preview` is added
        if: |
          github.event.action != 'closed' &&
          github.event.action != 'unlabeled' &&
          (github.event.action != 'labeled' || github.event.label.name == 'docs-preview')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit & build documentation
              run: |
                pip install -e .[dev]
                mkdocs build --clean --strict

            - name: Upload site artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: site
                  path: ./site/

    deploy-docs-preview:
        name: Deploy docs preview
        runs-on: ubuntu-latest
        needs: build-docs
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            (contains(github.event.pull_request.labels.*.name, 'docs-preview') &&
              (github.event.action == 'closed' || needs.build-docs.result == 'success')) ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview')
          )
        permissions:
            contents: write
            pull-requests: write
            deployments: read
        steps:
            - name: Checkout the base commit, never the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Download site artifact
              if: env.REMOVE_PREVIEW != 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: site
                  path: ./site/

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
              with:
                  # `auto` ignores `labeled` and `reopened` events, so pick the action explicitly
                  action: ${{ env.REMOVE_PREVIEW == 'true' && 'remove' || 'deploy' }}
                  source-dir: ./site/
                  preview-branch: gh-pages
                  qr-code: false
                  wait-for-pages-deployment: true

    portal-preview:
        name: Deploy doc-portal preview
        needs: [deploy-docs-preview]
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (contains(github.event.pull_request.labels.*.name, 'docs-preview') ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview')) &&
          (github.event.action == 'closed' || needs['deploy-docs-preview'].result == 'success')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        env:
            PORTAL_PREVIEW_PATH: portal-preview/pr-${{ github.event.pull_request.number }}
            DOC_PORTAL_IMAGE: europe-west9-docker.pkg.dev/pasqal-artifact/frontend/doc-portal:source-runtime
        steps:
            - name: Checkout the base commit, never the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Login to Artifact Registry
              if: env.REMOVE_PREVIEW != 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: europe-west9-docker.pkg.dev
                  username: _json_key
                  password: ${{ secrets.GCP_ARTIFACT_REGISTRY_SA }}

            - name: Pull the doc portal image
              if: env.REMOVE_PREVIEW != 'true'
              run: docker pull "$DOC_PORTAL_IMAGE"

            - name: Build the portal preview
              if: env.REMOVE_PREVIEW != 'true'
              run: |
                mkdir -p portal-dist
                docker run --rm \
                  --user 0:0 \
                  --volume "$PWD/portal-dist:/out" \
                  --env BUILD_CONFIG='{"qoolqit":"https://pasqal-io.github.io/qoolqit/pr-preview/pr-${{ github.event.pull_request.number }}/"}' \
                  --env CONTENT_SOURCES=qoolqit \
                  --env SKIP_DOC_VERSIONS=true \
                  --env ASTRO_BASE="/qoolqit/${PORTAL_PREVIEW_PATH}/" \
                  --entrypoint sh \
                  "$DOC_PORTAL_IMAGE" \
                  -c 'cd /app && pnpm --filter @pasqal/doc-portal run build:selected && cp -r /app/packages/doc-portal/dist/. /out/'

            - name: Deploy portal preview
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
              with:
                  action: ${{ env.REMOVE_PREVIEW == 'true' && 'remove' || 'deploy' }}
                  source-dir: ./portal-dist/
                  preview-branch: gh-pages
                  umbrella-dir: portal-preview
                  qr-code: false
                  comment: false

            - name: Comment the preview link on the PR
              if: env.REMOVE_PREVIEW != 'true'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  message: |
                    Doc portal preview: https://pasqal-io.github.io/qoolqit/${{ env.PORTAL_PREVIEW_PATH }}/qoolqit/

                    Built from ${{ github.event.pull_request.head.sha }}.

            - name: Remove the preview comment
              if: env.REMOVE_PREVIEW == 'true'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  delete: true

    publish-dev-docs:
        name: Publish development docs
        needs: [portal-preview]
        if: |
          always() &&
          github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit with development dependencies
              run: pip install -e .[dev]

            - name: Deploy docs
              run: |
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git fetch origin gh-pages
                mike deploy --push --update-aliases main development
