name: Docs

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - closed

concurrency: gh-pages-${{ github.repository }}

jobs:
    build-docs:
        name: Build docs
        if: github.event.action != 'closed' # No need to build docs when PR is closed
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit & build documentation
              run: |
                pip install -e .[dev]
                mkdocs build --clean --strict

            - name: Upload site artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: site
                  path: ./site/

    deploy-docs-preview:
        name: Deploy docs preview
        runs-on: ubuntu-latest
        needs: build-docs
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action == 'closed' || needs.build-docs.result == 'success')
        permissions:
            contents: write
            pull-requests: write
            deployments: read
        steps:
            - name: Checkout the base commit, never the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Download site artifact
              if: github.event.action != 'closed'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: site
                  path: ./site/

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
              with:
                  source-dir: ./site/
                  preview-branch: gh-pages
                  qr-code: false
                  wait-for-pages-deployment: true

    build-doc-portal:
        name: Build doc-portal preview
        needs: [deploy-docs-preview]
        if: |
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.action != 'closed' &&
          needs['deploy-docs-preview'].result == 'success'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            PORTAL_PREVIEW_PATH: portal-preview/pr-${{ github.event.pull_request.number }}
            DOC_PORTAL_IMAGE: europe-west9-docker.pkg.dev/pasqal-artifact/frontend/doc-portal:source-runtime
        steps:
            - name: Login to Artifact Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: europe-west9-docker.pkg.dev
                  username: _json_key
                  password: ${{ secrets.GCP_ARTIFACT_REGISTRY_SA }}

            - name: Pull the doc portal image
              run: docker pull "$DOC_PORTAL_IMAGE"

            - name: Build the portal preview
              run: |
                mkdir -p portal-dist
                docker run --rm \
                  --user 0:0 \
                  --volume "$PWD/portal-dist:/out" \
                  --env BUILD_CONFIG='{"qoolqit":"https://pasqal-io.github.io/qoolqit/pr-preview/pr-${{ github.event.pull_request.number }}/"}' \
                  --env ASTRO_BASE="/qoolqit/${PORTAL_PREVIEW_PATH}/" \
                  --entrypoint sh \
                  "$DOC_PORTAL_IMAGE" \
                  -c 'cd /app && pnpm --filter @pasqal/doc-portal run build:selected && cp -r /app/packages/doc-portal/dist/. /out/'

            # Keep only the qoolqit pages and the shared assets they load; the other products are ~130 MB per preview.
            # Temporary until doc-portal can build qoolqit alone, see #488.
            - name: Trim the portal preview to qoolqit
              run: |
                mkdir -p portal-trimmed
                cd portal-dist
                cp -r qoolqit _astro assets pagefind favicon.* ../portal-trimmed/

            - name: Upload doc-portal artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: doc-portal
                  path: ./portal-trimmed/

    deploy-doc-portal:
        name: Deploy doc-portal preview
        needs: [build-doc-portal]
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action == 'closed' || needs['build-doc-portal'].result == 'success')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        env:
            PORTAL_PREVIEW_PATH: portal-preview/pr-${{ github.event.pull_request.number }}
        steps:
            - name: Checkout the base commit, never the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Download doc-portal artifact
              if: github.event.action != 'closed'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: doc-portal
                  path: ./portal-trimmed/

            - name: Deploy portal preview
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
              with:
                  source-dir: ./portal-trimmed/
                  preview-branch: gh-pages
                  umbrella-dir: portal-preview
                  qr-code: false
                  comment: false

            - name: Comment the preview link on the PR
              if: github.event.action != 'closed'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  message: |
                    Doc portal preview: https://pasqal-io.github.io/qoolqit/${{ env.PORTAL_PREVIEW_PATH }}/qoolqit/

                    Built from ${{ github.event.pull_request.head.sha }}.

            - name: Remove the preview comment
              if: github.event.action == 'closed'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  delete: true

    publish-dev-docs:
        name: Publish development docs
        needs: [deploy-doc-portal]
        if: |
          always() &&
          github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit with development dependencies
              run: pip install -e .[dev]

            - name: Deploy docs
              run: |
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git fetch origin gh-pages
                mike deploy --push --update-aliases main development
