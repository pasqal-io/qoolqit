name: Docs

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
            - closed

env:
    # Previews exist while the PR has the `docs-preview` label: removing it or closing the PR removes them
    REMOVE_PREVIEW: >-
        ${{ github.event.action == 'closed' ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview') }}

jobs:
    build-docs:
        name: Build docs
        # Build on new commits, and when the `docs-preview` label is added
        if: |
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          (github.event.action == 'labeled' && github.event.label.name == 'docs-preview' && github.event.pull_request.state == 'open')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit & build documentation
              run: |
                pip install -e .[dev]
                zensical build --clean --strict

            - name: Upload site artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site
                  path: ./site/

    deploy-docs-preview:
        name: Deploy docs preview
        runs-on: ubuntu-latest
        needs: build-docs
        concurrency:
            group: gh-pages-${{ github.repository }}
            queue: max  # wait in line, never cancel: every write to gh-pages must happen
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            (contains(github.event.pull_request.labels.*.name, 'docs-preview') &&
              (github.event.action == 'closed' || needs.build-docs.result == 'success')) ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview')
          )
        permissions:
            contents: write
            pull-requests: write
            deployments: read
        steps:
            - name: Checkout the base commit, never the PR head
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Download site artifact
              if: env.REMOVE_PREVIEW != 'true'
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site
                  path: ./site/

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
              with:
                  # `auto` ignores `labeled` and `reopened` events, so pick the action explicitly
                  action: ${{ env.REMOVE_PREVIEW == 'true' && 'remove' || 'deploy' }}
                  source-dir: ./site/
                  preview-branch: gh-pages
                  qr-code: false
                  wait-for-pages-deployment: true

    portal-preview:
        name: Deploy doc portal preview
        needs: [deploy-docs-preview]
        # One preview per PR, a newer push replaces the running deploy
        concurrency:
            group: portal-preview-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        if: |
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            (contains(github.event.pull_request.labels.*.name, 'docs-preview') &&
              (github.event.action == 'closed' || needs['deploy-docs-preview'].result == 'success')) ||
            (github.event.action == 'unlabeled' && github.event.label.name == 'docs-preview')
          )
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        env:
            PREVIEW_PATH: qoolqit/pr-${{ github.event.pull_request.number }}
            MKDOCS_PREVIEW_URL: https://pasqal-io.github.io/qoolqit/pr-preview/pr-${{ github.event.pull_request.number }}/
            BUCKET: ${{ vars.DOC_PREVIEW_BUCKET }}
            HOST: ${{ vars.DOC_PREVIEW_HOST }}
            DOC_PORTAL_IMAGE: europe-west9-docker.pkg.dev/pasqal-artifact/frontend/doc-portal:builder
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  # Service account dedicated to doc previews: pulls the image, writes to the bucket
                  credentials_json: ${{ secrets.GCP_DOC_PREVIEW_SA }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

            - name: Login to Artifact Registry
              if: env.REMOVE_PREVIEW != 'true'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: europe-west9-docker.pkg.dev
                  username: _json_key
                  password: ${{ secrets.GCP_DOC_PREVIEW_SA }}

            - name: Build the doc portal preview
              if: env.REMOVE_PREVIEW != 'true'
              run: |
                mkdir -p portal-dist
                docker run --rm \
                  --volume "$PWD/portal-dist:/out" \
                  --env CONTENT_SOURCES=qoolqit \
                  --env SKIP_DOC_VERSIONS=true \
                  --env ASTRO_BASE="/${PREVIEW_PATH}/" \
                  --env BUILD_CONFIG="{\"qoolqit\":\"${MKDOCS_PREVIEW_URL}\"}" \
                  "$DOC_PORTAL_IMAGE"

            - name: Upload the preview
              if: env.REMOVE_PREVIEW != 'true'
              run: |
                gcloud storage rm --recursive "gs://${BUCKET}/${PREVIEW_PATH}/" --quiet || true
                gcloud storage cp --recursive --cache-control=no-store 'portal-dist/*' "gs://${BUCKET}/${PREVIEW_PATH}/"

            - name: Remove the preview
              if: env.REMOVE_PREVIEW == 'true'
              run: gcloud storage rm --recursive "gs://${BUCKET}/${PREVIEW_PATH}/" --quiet || true

            - name: Comment the preview link on the PR
              if: env.REMOVE_PREVIEW != 'true'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  message: |
                    Doc portal preview: https://${{ env.HOST }}/${{ env.PREVIEW_PATH }}/qoolqit/

                    Built from ${{ github.event.pull_request.head.sha }}.

            - name: Remove the preview comment
              if: env.REMOVE_PREVIEW == 'true'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  header: doc-portal-preview
                  delete: true

    publish-dev-docs:
        name: Publish development docs
        needs: [portal-preview]
        concurrency:
            group: gh-pages-${{ github.repository }}
            queue: max  # wait in line, never cancel: every write to gh-pages must happen
        if: |
          always() &&
          github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout QoolQit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: '3.14'

            - name: Install QoolQit with development dependencies
              # Temporary: Zensical-compatible mike fork until Zensical ships native versioning.
              # See https://zensical.org/docs/compatibility/mkdocs/mike/
              run: |
                pip install git+https://github.com/squidfunk/mike.git
                pip install -e .[dev]

            - name: Deploy docs
              run: |
                git config user.name "GitHub Actions"
                git config user.email "actions@github.com"
                git fetch origin gh-pages
                mike deploy --push --update-aliases main development
