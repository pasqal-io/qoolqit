name: Publish QoolQit to PyPI and publish docs

on:
  release:
      types:
        - published

concurrency:
  group: fast-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    publish_pypi:
        name: Publish package to PyPI
        runs-on: ubuntu-latest
        permissions:
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write
        steps:
        - name: Check out QoolQit
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            ref: ${{ github.ref }}
        - name: Set up Python
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
          with:
            python-version: '3.14'
        - name: Set up uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: "0.13.5"
        - name: Build package
          run: |
            uv build
        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        - name: Confirm deployment
          timeout-minutes: 5
          run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            until pip download --no-deps qoolqit==$VERSION
            do
                echo "Failed to download from PyPI, will wait for upload and retry."
                sleep 1
            done

    publish_docs:
        name: Publish docs to github pages
        runs-on: ubuntu-latest
        steps:
        - name: Checkout QoolQit
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Set up Python
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
          with:
            python-version: '3.14'
        - name: Set up uv
          uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
            version: "0.13.5"
        - name: Install QoolQit with development dependencies
          # Temporary: Zensical-compatible mike fork until Zensical ships native versioning.
          # See https://zensical.org/docs/compatibility/mkdocs/mike/
          run: |
            uv pip install --system git+https://github.com/squidfunk/mike.git -e .[dev] --torch-backend=cpu
        - name: Deploy docs
          run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git fetch origin gh-pages
            mike deploy --push --update-aliases ${{ github.ref_name }} latest
