name: Publish QoolQit to PyPI and publish docs

on:
  release:
      types:
        - published

concurrency:
  group: fast-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    publish_pypi:
        name: Publish package to PyPI
        runs-on: ubuntu-latest
        permissions:
            # IMPORTANT: this permission is mandatory for trusted publishing
            id-token: write
        steps:
        - name: Check out QoolQit
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            ref: ${{ github.ref }}
        - name: Set up Python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: '3.14'
        - name: Install Python dependencies
          run: |
            pip install --upgrade pip
            pip install build
        - name: Build package
          run: |
            python -m build
        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        - name: Confirm deployment
          timeout-minutes: 5
          run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            until pip download qoolqit==$VERSION
            do
                echo "Failed to download from PyPI, will wait for upload and retry."
                sleep 1
            done

    publish_docs:
        name: Publish docs to github pages
        runs-on: ubuntu-latest
        steps:
        - name: Checkout QoolQit
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        - name: Set up Python
          uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
          with:
            python-version: '3.14'
        - name: Install QoolQit with development dependencies
          run: |
            pip install -e .[dev]
        - name: Deploy docs
          run: |
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git fetch origin gh-pages
            mike deploy --push --update-aliases ${{ github.ref_name }} latest
