# Update development version of documentation on successful PR
name: Docs dev version

on:
  pull_request:
    types:
      - closed

jobs:
  publish_dev_docs:
    name: Publish development docs to github pages
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout QoolQit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - name: Install QoolQit with development dependencies
      run: |
        pip install -e .[dev]
    - name: Deploy docs
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git fetch origin gh-pages
        mike deploy --push --update-aliases main development
