repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

# Reformat source code.
-   repo: https://github.com/ambv/black
    rev: "26.10.1"
    hooks:
      - id: black

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.4"
    hooks:
      - id: ruff-check
        args: [--fix]

# Run mypy in the project environment, so it sees the types of qoolqit's dependencies.
-   repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true

- repo: https://github.com/kynan/nbstripout
  rev: 0.9.1
  hooks:
    - id: nbstripout
