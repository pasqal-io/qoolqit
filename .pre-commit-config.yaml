repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^uv\.lock$

# Regenerate uv.lock when pyproject.toml changes; in CI, fail if the committed lock is stale.
# Keep the rev in sync with the uv version in .github/workflows.
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.13.7"
    hooks:
      - id: uv-lock

# Reformat source code.
-   repo: https://github.com/ambv/black
    rev: "26.10.1"
    hooks:
      - id: black

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.4"
    hooks:
      - id: ruff-check
        args: [--fix]

# Run mypy in the project environment, so it sees the types of qoolqit's dependencies.
-   repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types_or: [python, pyi]
        require_serial: true

- repo: https://github.com/kynan/nbstripout
  rev: 0.9.2
  hooks:
    - id: nbstripout
