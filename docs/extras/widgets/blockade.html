<div class="blockade not-content">

<div class="controls">
  <div><label for="bk-r"><span>Distance <span class="arithmatex">\(\tilde r\)</span></span><span id="bk-rv"></span></label>
    <input id="bk-r" type="range" min="1" max="3" step="0.01" value="1"></div>
  <div><label for="bk-o"><span>Drive amplitude <span class="arithmatex">\(\tilde\Omega\)</span></span><span id="bk-ov"></span></label>
    <input id="bk-o" type="range" min="0.02" max="0.2" step="0.01" value="0.1"></div>
</div>

<div class="readouts">
  <div>Interaction <span class="arithmatex">\(\tilde J = \tilde r^{-6}\)</span><b id="bk-j"></b></div>
  <div>Blockade radius <span class="arithmatex">\(\tilde r_b\)</span><b id="bk-rb"></b></div>
  <div><span class="arithmatex">\(\tilde J / \tilde\Omega\)</span><b id="bk-ratio"></b></div>
</div>

<div class="panels">
  <div class="panel">
    <div class="head"><span>Atoms and blockade disks</span></div>
    <svg id="bk-scene" viewBox="0 0 300 170" role="img" aria-label="Two atoms with their blockade disks; drag an atom to change the distance"><g id="bk-disks"></g><g id="bk-atoms"></g>
      <line x1="14" x2="74" y1="160" y2="160" stroke="currentColor" stroke-opacity=".5" stroke-width="2"/><text x="44" y="154" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".6" style="pointer-events:none">unit distance</text></svg>
  </div>
  <div class="panel">
    <div class="head"><span>Populations, <span class="arithmatex">\(\tilde t\)</span> = <span id="bk-tlabel"></span></span><button id="bk-play" type="button">Pause</button></div>
    <svg id="bk-plot" viewBox="0 0 300 170" role="img" aria-label="Excitation probabilities versus time"></svg>
  </div>
</div>
<div class="legend">
  <span><i style="border-color:var(--one)"></i>one excitation (<span class="arithmatex">\(|01\rangle\)</span> or <span class="arithmatex">\(|10\rangle\)</span>)</span>
  <span><i style="border-color:var(--both)"></i>two excitations (<span class="arithmatex">\(|11\rangle\)</span>)</span>
</div>
<div class="status"><span class="dot"></span><span id="bk-text"></span></div>
<div class="presets"><button type="button" data-r="1" style="--c:var(--one)">Blockaded</button><button type="button" data-r="rb" style="--c:color-mix(in oklab, var(--one), var(--both))">At the blockade radius</button><button type="button" data-r="2.5" style="--c:var(--both)">Independent</button></div>

<!-- data-astro-rerun: the docs portal navigates with Astro view transitions, which run an inline script only once per session unless told otherwise -->
<script data-astro-rerun>
(function(){
const root=document.currentScript.parentElement, $=id=>root.querySelector("#bk-"+id);
// Styles are injected from the script: some site builds (the docs portal) strip <style> blocks but keep scripts.
// Colours: qoolqit.visualization.COLORS mintgreen (--one) and neonpurple (--both); the rest falls back to the page text colour when Material's variables are absent.
const style=document.createElement("style");style.textContent=".blockade{--one:#00C887;--both:#867BFA;--atom:var(--one);--ink:var(--md-default-fg-color,currentColor);--muted:var(--md-default-fg-color--light,color-mix(in srgb,currentColor 65%,transparent));\n  --line:var(--md-default-fg-color--lightest,color-mix(in srgb,currentColor 18%,transparent));--panel:var(--md-code-bg-color,color-mix(in srgb,currentColor 6%,transparent));max-width:640px;margin:16px auto}\n.blockade .controls>div,.blockade .readouts>div,.blockade .panels>div,.blockade .legend>span,.blockade .presets>button{margin:0} /* grids stay aligned whatever the host page adds */\n.blockade .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}\n.blockade svg{display:block;width:100%;height:auto;color:var(--ink)}\n.blockade #bk-scene{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}\n.blockade .panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n@media (max-width:560px){.blockade .panels{grid-template-columns:1fr}}\n.blockade .head{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:600;min-height:28px}\n.blockade .status{display:flex;align-items:center;gap:.6rem;margin:10px 2px 0;font-size:.85rem;font-weight:500}\n.blockade .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--atom)}\n.blockade .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:12px 0}\n.blockade .controls label{display:flex;justify-content:space-between;font-size:.85rem}\n.blockade .controls label>span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}\n.blockade input[type=range]{width:100%;accent-color:var(--atom)}\n.blockade .readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;font-size:.85rem}\n.blockade .readouts div{border-top:2px solid var(--line);padding-top:4px}\n.blockade .readouts b{display:block;font-size:1rem;font-variant-numeric:tabular-nums}\n.blockade button{font:inherit;font-size:.8rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}\n.blockade .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:4px}\n.blockade .legend i{display:inline-block;width:18px;border-top:2.5px solid;vertical-align:middle;margin-right:6px}\n.blockade .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}\n.blockade .presets button{border:.75px solid var(--c)}";
root.prepend(style);
const el=(tag,attrs,parent)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;};
const PERIODS=4, SAMPLES=300; // time window in single-atom Rabi periods, samples per period
let N=0, T=0, step=0; // samples per curve, time window, tick spacing: all set from om in compute()
let r=1, om=0.1, data=null, tau=0, playing=!matchMedia("(prefers-reduced-motion: reduce)").matches, last=null, raf=0;

// Eigendecomposition of a real symmetric 3x3 matrix by Jacobi rotations.
function eigSym(A){const a=A.map(x=>x.slice()), v=[[1,0,0],[0,1,0],[0,0,1]];
  for(let sweep=0;sweep<60;sweep++){if(a[0][1]**2+a[0][2]**2+a[1][2]**2<1e-24)break;
    for(let p=0;p<2;p++)for(let q=p+1;q<3;q++){if(Math.abs(a[p][q])<1e-300)continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]), t=(th>=0?1:-1)/(Math.abs(th)+Math.sqrt(th*th+1)), c=1/Math.sqrt(t*t+1), s=t*c;
      for(let k=0;k<3;k++){const x=a[k][p],y=a[k][q];a[k][p]=c*x-s*y;a[k][q]=s*x+c*y;}
      for(let k=0;k<3;k++){const x=a[p][k],y=a[q][k];a[p][k]=c*x-s*y;a[q][k]=s*x+c*y;}
      for(let k=0;k<3;k++){const x=v[k][p],y=v[k][q];v[k][p]=c*x-s*y;v[k][q]=s*x+c*y;}}}
  return {vals:[a[0][0],a[1][1],a[2][2]],vecs:v};}

// Populations of (|01>+|10>)/sqrt2 and |11> under H in the basis {|00>, (|01>+|10>)/sqrt2, |11>}, from |00>.
function compute(){
  // Window of PERIODS Rabi periods, rounded to a clean tick value; the sample count follows so curves stay smooth at any om
  const raw=PERIODS*2*Math.PI/om, mag=Math.pow(10,Math.floor(Math.log10(raw/5))), nm=raw/5/mag;
  step=(nm<1.5?1:nm<3.5?2:nm<7.5?5:10)*mag;T=Math.max(step,Math.round(raw/step)*step);N=Math.round(SAMPLES*T*om/(2*Math.PI));tau=Math.min(tau,T);
  const J=Math.pow(r,-6), a=om/Math.SQRT2, {vals,vecs}=eigSym([[0,a,0],[a,0,a],[0,a,J]]);
  const one=new Float64Array(N+1), two=new Float64Array(N+1);
  for(let i=0;i<=N;i++){const t=T*i/N;
    for(const [j,arr] of [[1,one],[2,two]]){let re=0,im=0;
      for(let k=0;k<3;k++){const w=vecs[j][k]*vecs[0][k];re+=w*Math.cos(vals[k]*t);im-=w*Math.sin(vals[k]*t);}
      arr[i]=re*re+im*im;}}
  data={J,Rb:Math.pow(om,-1/6),one,two};}

// Scene: two atoms with disks of radius r_b/2, which overlap exactly when the pair is blockaded
const CX=150, CY=78, S=60, scene=$("scene"), disks=$("disks"), atoms=$("atoms"), disk=[], glow=[], core=[]; // scene centre, px per unit distance
for(let i=0;i<2;i++){
  disk.push(el("circle",{cy:CY,fill:"var(--atom)","fill-opacity":.14,stroke:"var(--atom)","stroke-opacity":.8,"stroke-dasharray":"2 4"},disks));
  glow.push(el("circle",{cy:CY,fill:"var(--atom)"},atoms));
  core.push(el("circle",{cy:CY,r:6,fill:"currentColor",stroke:"var(--panel)","stroke-width":2},atoms));}
const atomX=i=>CX+(i?1:-1)*r*S/2;
function drawScene(){for(let i=0;i<2;i++){disk[i].setAttribute("cx",atomX(i));disk[i].setAttribute("r",data.Rb*S/2);
  glow[i].setAttribute("cx",atomX(i));core[i].setAttribute("cx",atomX(i));}}

// Plot
const P={l:30,r:16,t:8,b:30,w:300,h:170}, plot=$("plot");
const px=t=>P.l+(P.w-P.l-P.r)*t/T, py=p=>P.t+(P.h-P.t-P.b)*(1-p);
const grid=el("g",{},plot), curves=el("g",{fill:"none","stroke-width":2,"stroke-linejoin":"round"},plot);
const path=(arr,n)=>{let d="";for(let i=0;i<=n;i++)d+=(i?"L":"M")+px(T*i/N).toFixed(1)+" "+py(arr[i]).toFixed(1);return d;};
for(const p of [0,.5,1]){el("line",{x1:P.l,x2:P.w-P.r,y1:py(p),y2:py(p),stroke:"currentColor","stroke-opacity":.15},grid);
  el("text",{x:P.l-6,y:py(p)+4,"text-anchor":"end","font-size":11,fill:"currentColor","fill-opacity":.7},grid).textContent=p;}
const ticks=el("g",{},grid);
function drawTicks(){ticks.innerHTML="";for(let k=0;k<=T+1e-9;k+=step)el("text",{x:px(k),y:P.h-P.b+13,"text-anchor":"middle","font-size":11,fill:"currentColor","fill-opacity":.7},ticks).textContent=+k.toFixed(6);}
el("text",{x:(P.l+P.w-P.r)/2,y:P.h-3,"text-anchor":"middle","font-size":11,fill:"currentColor","fill-opacity":.7},grid).textContent="time";
const one=el("path",{stroke:"var(--one)"},curves), two=el("path",{stroke:"var(--both)"},curves);

// Time: curves drawn up to t, and each atom glows with its excitation probability
function drawTime(){
  const i=Math.min(N,Math.round(tau/T*N)), p=data.one[i]/2+data.two[i];
  for(const g of glow){g.setAttribute("fill-opacity",(0.08+0.6*p).toFixed(3));g.setAttribute("r",(10+10*p).toFixed(1));}
  one.setAttribute("d",path(data.one,i));two.setAttribute("d",path(data.two,i));
  $("tlabel").textContent=tau.toFixed(0);}
const fmt=x=>x>=10?x.toFixed(1):x>=1?x.toFixed(2):x.toPrecision(2);
function drawText(){
  // Colour of the atoms, the status dot and the sliders: blockaded (green) to independent (purple), weighted by the drive against the interaction
  root.style.setProperty("--atom",`color-mix(in oklab, var(--both) ${(100*om/(om+data.J)).toFixed(0)}%, var(--one))`);
  $("rv").textContent=r.toFixed(2);$("ov").textContent=om.toFixed(2);
  $("j").textContent=fmt(data.J);$("rb").textContent=data.Rb.toFixed(2);$("ratio").textContent=fmt(data.J/om);
  const q=r/data.Rb, text=$("text");
  if(q<0.85)text.textContent="Blockaded: the atoms share a single excitation";
  else if(q<1.2)text.textContent="Near the blockade radius: partial blockade";
  else text.textContent="Independent: each atom oscillates on its own";}
function refresh(){compute();drawText();drawScene();drawTicks();drawTime();}

$("r").addEventListener("input",e=>{r=+e.target.value;refresh();});
$("o").addEventListener("input",e=>{om=+e.target.value;refresh();});
let dragging=false;
const move=ev=>{const pt=scene.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const u=pt.matrixTransform(scene.getScreenCTM().inverse());
  r=Math.min(3,Math.max(1,Math.round(200*Math.abs(u.x-CX)/S)/100));$("r").value=r;refresh();};
scene.addEventListener("pointerdown",ev=>{ev.preventDefault();dragging=true;scene.setPointerCapture(ev.pointerId);move(ev);});
scene.addEventListener("pointermove",ev=>{if(dragging)move(ev);});
scene.addEventListener("pointerup",()=>{dragging=false;});scene.addEventListener("pointercancel",()=>{dragging=false;});
const btn=$("play"), setBtn=()=>btn.textContent=playing?"Pause":"Play";
function loop(ts){raf=0;if(!playing||!root.isConnected)return; /* stop once the widget has been swapped out of the page */if(last!==null)tau=(tau+(ts-last)/1000*(T/8))%T;last=ts;drawTime();raf=requestAnimationFrame(loop);}
btn.addEventListener("click",()=>{playing=!playing;last=null;setBtn();if(playing&&!raf)raf=requestAnimationFrame(loop);});
// Presets: the three cases of the page at drive 0.1, paused at the end of the time window
for(const b of root.querySelectorAll(".presets button"))b.addEventListener("click",()=>{
  om=0.1;r=b.dataset.r==="rb"?Math.pow(om,-1/6):+b.dataset.r;$("r").value=r;$("o").value=om;
  playing=false;setBtn();tau=Infinity;refresh();}); // compute() clamps tau to T

refresh();setBtn();
if(playing)raf=requestAnimationFrame(loop);else{tau=T/8;drawTime();}
})();
</script>
</div>
